
<!DOCTYPE html>
<html>
<head>
    
    <style>
        .main-box {
            border: 2px solid black;
            width: 600px;
            height: 200px;
            display: flex;
            align-items: center;
            background-color: rgb(226, 122, 186);
            justify-content: space-around;
        }

        .para-box {
            border: 1px solid rgb(8, 8, 16);
            width: 150px;
            height: 100px;
            display: flex;
            background-color: rgb(88, 233, 233);
            align-items: center;
            justify-content: center;
        }

        .input-box {
            display: flex;
            background-color: rgb(181, 224, 70);
            flex-direction: column;
            gap: 10px;
        }

        input {
            width: 180px;
            height: 25px;
            background-color: rgb(58, 199, 152);
        }

        button {
            height: 30px;
            background-color: rgb(216, 146, 54);
        }
        .main-box1 {
            border: 2px solid black;
            width: 600px;
            height: 200px;
            text-align: center;
            background-size: cover;
        }

        h1 {
            color: rgb(31, 15, 15);
        }

        .image-box {
            display: flex;
            justify-content: space-evenly;
        }

        .image-box img {
            width: 170px;
            height: 170px;
            border: 1px solid rgb(123, 55, 55);
        }
          .main-box3 {
            border: 2px solid black;
            width: 600px;
            height: 200px;
            text-align: center;
        }

        h2 {
            color: rgb(78, 174, 82);
            display: flex;
            padding-top: 1px;
        }

        .box-container {
            display: flex;
            justify-content: space-evenly;
        }

        .para-box {
            border: 2px solid rgb(149, 133, 182);
            width: 220px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="main-box">

        <div class="para-box">
            <p>MY FIRST WEBSITE</p>
        </div>

        <div class="input-box">
            <input type="text" placeholder="Enter Name">
            <input type="text" placeholder="Enter Email">
            <button>click</button>
        </div>

    </div>
      <div class="main-box1">

        <h1>Trending</h1>

        <div class="image-box">
            <img src="sunset1.jpg" alt="Image 1">
            <img src="sunset2.jfif" alt="Image 2">
            <img src="sunset3.jfif" alt="Image 3">
            <img src="sunset5.jfif" alt="Image 4">
        </div>

    </div>
    
    <div class="main-box3">

        <h2>More</h2>

        <div class="box-container">

            <div class="para-box">
                <p>This is paragraph one.</p>
            </div>

            <div class="para-box">
                <p>This is paragraph two.</p>
            </div>

            <div class="para-box">
                <p>This is paragraph three.</p>
            </div>

        </div>

    </div>
</body>
</html>
